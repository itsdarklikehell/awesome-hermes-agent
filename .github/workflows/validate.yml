name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require core files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f assets/github-social.svg
          test -f assets/system-blueprint.svg
      - name: Basic link sanity (no raw secrets patterns)
        run: |
          if grep -REI '(api[_-]?key|sk-[a-zA-Z0-9]{20,}|BEGIN PRIVATE KEY)' README.md CONTRIBUTING.md; then
            echo "Possible secret pattern in docs"
            exit 1
          fi
          echo "ok"

  gource:
    name: Generate Gource video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Gource video
        uses: nbprojekt/gource-action@v1.3.0
        with:
          gource-video-length: 60
          gource-title: 'awesome-hermes-agent development timeline'
          hide-mouse: true
          hide-date: true
          hide-filenames: true
          auto-rotate: true
          camera-mode: overview

      - name: Re-encode with ffmpeg
        run: |
          ffmpeg -i gource.mp4 -c:v libx264 -preset slow -crf 18 \
            -pix_fmt yuv420p -vf "scale=1920:1080" \
            -c:a aac -b:a 192k -movflags +faststart \
            awesome-hermes-agent_gource_1080p.mp4

      - name: Upload Gource video
        uses: actions/upload-artifact@v4
        with:
          name: gource-video
          path: awesome-hermes-agent_gource_1080p.mp4
          retention-days: 90

      - name: Upload video to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: awesome-hermes-agent_gource_1080p.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
